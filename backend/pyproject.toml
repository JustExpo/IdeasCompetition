[project]
name = "ideas-competition-backend"
version = "0.1.0"
description = "Backend сервиса «Конкурс идей»"
requires-python = ">=3.12"
# Зависимости рантайма — CLAUDE.md §5; каждая записана в §17 (зачем, лицензия). Точные версии — uv.lock.
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.156.0",
    "limits>=5.8.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "hypothesis>=6.170.5",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: без БД и сети (tests/unit, ставится автоматически)",
    "integration: реальный PostgreSQL (БД с суффиксом _test)",
    "commits: integration-тест с реальным commit, после него TRUNCATE",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Наборы правил — CLAUDE.md §6.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "S", "BLE", "T20", "TID", "ASYNC", "PT", "N", "ERA"]
# Тексты и комментарии на русском: кириллица не «двусмысленный» символ.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Время читается только через Clock (CLAUDE.md §6.2, Р4); исключение — app/core/clock.py (IC-003).
"datetime.datetime.now".msg = "Время — только через app.core.clock.Clock"
"datetime.datetime.utcnow".msg = "Время — только через app.core.clock.Clock"
"datetime.datetime.today".msg = "Время — только через app.core.clock.Clock"
"datetime.date.today".msg = "Время — только через app.core.clock.Clock"
"time.time".msg = "Время — только через app.core.clock.Clock"
"time.sleep".msg = "Блокирующий sleep запрещён; ожидание — через Clock или asyncio-примитивы"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert — основной инструмент pytest

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["app"]
