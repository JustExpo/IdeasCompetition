[project]
name = "ideas-competition-backend"
version = "0.1.0"
description = "Backend сервиса «Конкурс идей»"
requires-python = ">=3.12"
# Зависимости рантайма (FastAPI, SQLAlchemy и др., CLAUDE.md §5) добавляются на этапе каркаса.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Наборы правил — CLAUDE.md §6.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "S", "BLE", "T20", "TID", "ASYNC", "PT", "N", "ERA"]
# Тексты и комментарии на русском: кириллица не «двусмысленный» символ.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert — основной инструмент pytest

[tool.mypy]
python_version = "3.12"
strict = true
