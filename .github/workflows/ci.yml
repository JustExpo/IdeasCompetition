# Проверки каждого PR (CLAUDE.md §13, п. 1, 3, 4). Зелёный CI обязателен до мержа.
# Frontend и контракт добавлены в IC-015, e2e — IC-030.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, import-linter, unit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Установить зависимости по lock-файлу
        run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy app tests
      - name: import-linter
        run: uv run lint-imports
      - name: unit-тесты
        run: uv run pytest -m unit --cov --cov-report=term-missing

  integration:
    name: integration (PostgreSQL 16, миграции)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ideas
          POSTGRES_PASSWORD: ideas-test-only # gitleaks:allow — тестовая БД на раннере
          POSTGRES_DB: ideas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideas -d ideas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ideas:ideas-test-only@127.0.0.1:5432/ideas_test # gitleaks:allow
      TEST_DATABASE_URL: postgresql+asyncpg://ideas:ideas-test-only@127.0.0.1:5432/ideas_test # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Установить зависимости по lock-файлу
        run: uv sync --frozen
      - name: Миграции вверх на пустой БД
        run: uv run alembic upgrade head
      - name: Модели совпадают со схемой (alembic check)
        run: uv run alembic check
      - name: Миграции вниз на одну ревизию
        run: uv run alembic downgrade -1
      - name: Миграции вверх повторно
        run: uv run alembic upgrade head
      - name: integration-тесты
        run: uv run pytest -m integration

  frontend:
    name: frontend (prettier, eslint, tsc, depcruise, vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости по lock-файлу
        run: npm ci
      - name: prettier
        run: npm run format:check
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: dependency-cruiser
        run: npm run depcruise
      - name: vitest
        run: npm test
      - name: vite build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  contract:
    name: contract (OpenAPI и типы без расхождений)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости backend и frontend
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)
      - name: make test-contract (регенерация без diff)
        run: make test-contract

  docker:
    name: docker (образ, compose, один контейнер)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: make up
        run: make up
      - name: /api/health = 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)
          test "$code" = 200
      - name: SPA отдаётся контейнером под CSP, неизвестный /api — 404 problem+json
        run: |
          for path in / /contests/1; do
            curl -sS -D - -o /dev/null "http://127.0.0.1:8000$path" | tee /tmp/headers.txt | head -1 | grep -q '200'
            grep -qi '^content-security-policy: default-src' /tmp/headers.txt
          done
          curl -sS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -sS -D /tmp/headers.txt -o /tmp/body.json http://127.0.0.1:8000/api/unknown
          head -1 /tmp/headers.txt | grep -q '404'
          grep -qi '^content-type: application/problem+json' /tmp/headers.txt
          grep -q '"code":"not_found"' /tmp/body.json
      - name: Повторный make up не пересоздаёт контейнер
        run: |
          first=$(docker inspect -f '{{.Id}}' ideas-competition-app)
          docker inspect -f 'до: image={{.Image}} hash={{index .Config.Labels "com.docker.compose.config-hash"}}' ideas-competition-app
          make up
          second=$(docker inspect -f '{{.Id}}' ideas-competition-app)
          docker inspect -f 'после: image={{.Image}} hash={{index .Config.Labels "com.docker.compose.config-hash"}}' ideas-competition-app
          test "$first" = "$second"
      - name: Контейнеров приложения ровно один
        run: test "$(docker ps -q --filter label=org.ideas-competition.role=app | wc -l)" = 1
      - name: Лог приложения при падении
        if: failure()
        run: docker compose logs --no-color
      - name: make down сохраняет volume
        if: always()
        run: |
          make down
          docker volume inspect ideas-competition_pgdata > /dev/null

  security:
    name: security (pip-audit, gitleaks)
    runs-on: ubuntu-24.04
    # gitleaks-action на PR читает список коммитов через API: нужен pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit по lock-файлу
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
